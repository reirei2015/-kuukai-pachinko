<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>喰界 -KUUKAI-</title>
<style>
:root{--red:#d71920;--gold:#ffd45a;--cyan:#72f4ff;--ink:#030305}
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
body{min-height:100vh;display:flex;justify-content:center;padding:14px}
button{font:inherit}
.cabinet{width:min(760px,100%);background:linear-gradient(180deg,#15151a,#030304 35%,#111116);border:2px solid #383840;border-radius:24px;padding:14px;box-shadow:0 0 45px #000,inset 0 0 30px #000}
.brand{display:flex;justify-content:space-between;align-items:center;padding:4px 8px 10px;font-weight:900;letter-spacing:.18em}
.brand b{color:#e9e9ee;font-size:20px}.brand span{font-size:11px;color:#777}
.stage{position:relative;overflow:hidden;border-radius:18px;border:3px solid #666;background:#020406;aspect-ratio:16/10;box-shadow:0 0 0 4px #0d0d10,0 0 30px #700}
.liquid{position:absolute;inset:0;background:
radial-gradient(circle at 50% 45%,#271016 0 10%,transparent 31%),
radial-gradient(circle at 25% 80%,#35101b 0 2%,transparent 18%),
radial-gradient(circle at 78% 20%,#28151a 0 2%,transparent 20%),
linear-gradient(180deg,#050609,#17070b 55%,#020204)}
.liquid:before{content:"";position:absolute;inset:-20%;background:repeating-radial-gradient(ellipse at 50% 100%,transparent 0 26px,#fff1 27px 28px,transparent 29px 58px);opacity:.12;animation:water 8s linear infinite}
.scan{position:absolute;inset:0;background:linear-gradient(transparent 49%,#fff1 50%,transparent 51%);background-size:100% 7px;opacity:.22;pointer-events:none}
.eye{position:absolute;width:23%;height:15%;left:38.5%;top:40%;border-radius:50%;border-top:5px solid #c91625;border-bottom:5px solid #c91625;filter:drop-shadow(0 0 15px #f00);animation:eyePulse 2.8s ease-in-out infinite;opacity:.42}
.eye:after{content:"";position:absolute;width:8%;height:90%;left:46%;top:5%;background:#ff3340;border-radius:50%;box-shadow:0 0 18px #f00}
.hand,.hand2{position:absolute;left:50%;top:-58%;width:38%;height:74%;transform:translateX(-50%);opacity:0;z-index:7;filter:drop-shadow(0 0 20px #000)}
.hand:before,.hand2:before{content:"";position:absolute;left:16%;bottom:0;width:68%;height:54%;border-radius:48% 48% 35% 35%;background:linear-gradient(90deg,#15151a,#5a4a4c 48%,#161419);border:2px solid #98888b;box-shadow:inset 0 0 25px #000}
.hand:after,.hand2:after{content:"";position:absolute;left:7%;top:4%;width:86%;height:58%;border-radius:45%;background:repeating-linear-gradient(90deg,#1a181b 0 13%,#726266 14% 18%,#171518 19% 27%);transform:skewY(-8deg);box-shadow:inset 0 0 25px #000}
.hand2{top:-64%;width:34%;left:42%;z-index:8}.hand2:before{transform:rotate(12deg)}.hand2:after{transform:skewY(8deg) rotate(12deg)}
.critical .hand{animation:handDrop 1.05s cubic-bezier(.2,.8,.2,1) forwards}.grip .hand{animation:grip 1.2s ease-out forwards}.grip .hand2{animation:grip2 1.2s ease-out forwards}
.flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:12;pointer-events:none}.flash.on{animation:flash .35s ease-out}
.hud{position:absolute;left:14px;right:14px;top:12px;z-index:20;display:flex;justify-content:space-between;gap:8px}
.badge{padding:5px 9px;border:1px solid #777;background:#000b;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.08em}
.badge.hot{border-color:#f33;color:#ff9b9b}.badge.rush{border-color:#ffd45a;color:#ffe89d}
.center{position:absolute;left:50%;top:68%;transform:translate(-50%,-50%);z-index:15;text-align:center;width:90%}
.message{font-weight:1000;font-size:clamp(18px,5vw,42px);letter-spacing:.18em;text-shadow:0 0 15px #000,0 0 30px #f00;min-height:1.3em}
.reels{display:flex;justify-content:center;gap:8px;margin-top:12px}.reel{width:22%;max-width:120px;height:64px;background:#e7e7e7;color:#111;border-radius:8px;display:grid;place-items:center;font-size:34px;font-weight:1000;border:3px solid #555;box-shadow:inset 0 0 12px #000}
.bottom{padding:14px 4px 2px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{background:#0d0d11;border:1px solid #303038;border-radius:10px;padding:8px;text-align:center}.stat small{display:block;color:#888;font-size:10px}.stat strong{font-size:18px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.controls button{border:0;border-radius:12px;padding:13px;background:linear-gradient(#333,#17171b);color:#fff;font-weight:900;letter-spacing:.08em;border:1px solid #555}.controls .start{background:linear-gradient(#d92731,#76070d);box-shadow:0 0 20px #600}.controls button:active{transform:scale(.98)}
.notice{text-align:center;color:#888;font-size:11px;margin-top:9px}.modal{position:absolute;inset:0;display:none;place-items:center;background:#000d;z-index:30}.modal.show{display:grid}.win{width:min(88%,480px);padding:25px;border:2px solid #ffd45a;border-radius:18px;text-align:center;background:radial-gradient(circle,#3b1116,#070709 70%);box-shadow:0 0 45px #d71920}.win h2{margin:0 0 8px;font-size:30px;color:#ffe28a}.win p{margin:7px 0;color:#ddd}.win button{margin-top:14px;border:0;border-radius:10px;padding:11px 22px;font-weight:900}
body.shake .stage{animation:shake .32s linear}
body.red .stage{box-shadow:0 0 0 4px #0d0d10,0 0 50px #e00018}
body.gold .stage{box-shadow:0 0 0 4px #0d0d10,0 0 60px #ffd45a}
@keyframes water{to{transform:translateY(30px)}}@keyframes eyePulse{50%{opacity:.9;transform:scale(1.08)}}@keyframes handDrop{0%{top:-58%;opacity:0}20%{opacity:1}70%{top:15%}100%{top:5%;opacity:1}}@keyframes grip{0%{top:-60%;opacity:0;transform:translateX(-50%) rotate(-8deg)}45%{opacity:1}100%{top:25%;transform:translateX(-50%) rotate(-18deg)}}@keyframes grip2{0%{top:-65%;opacity:0;transform:translateX(-50%) rotate(8deg)}45%{opacity:1}100%{top:20%;transform:translateX(-50%) rotate(20deg)}}@keyframes flash{0%{opacity:0}25%{opacity:.95}100%{opacity:0}}@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-8px,3px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-5px,-2px)}80%{transform:translate(5px,2px)}}
@media(max-width:480px){body{padding:5px}.cabinet{padding:8px;border-radius:17px}.stage{border-radius:12px}.reel{height:52px;font-size:27px}.stats{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr}.brand b{font-size:16px}}
</style>
</head>
<body>
<main class="cabinet">
  <div class="brand"><b>喰界 -KUUKAI-</b><span>ORIGINAL HORROR PACHINKO</span></div>
  <section class="stage" id="stage">
    <div class="liquid"></div><div class="scan"></div><div class="eye"></div>
    <div class="hand"></div><div class="hand2"></div><div class="flash" id="flash"></div>
    <div class="hud">
      <div class="badge" id="mode">通常時</div>
      <div class="badge" id="counter">RUSH残り ---</div>
    </div>
    <div class="center">
      <div class="message" id="message">START</div>
      <div class="reels"><div class="reel" id="r1">?</div><div class="reel" id="r2">?</div><div class="reel" id="r3">?</div></div>
    </div>
    <div class="modal" id="modal"><div class="win"><h2 id="winTitle">大当たり</h2><p id="winText"></p><button id="close">続行</button></div></div>
  </section>
  <section class="bottom">
    <div class="stats">
      <div class="stat"><small>持ち玉</small><strong id="balls">0</strong></div>
      <div class="stat"><small>RUSH継続</small><strong id="streak">0</strong></div>
      <div class="stat"><small>大当たり</small><strong id="hits">0</strong></div>
      <div class="stat"><small>RUSH回数</small><strong id="rushes">0</strong></div>
    </div>
    <div class="controls">
      <button class="start" id="start">START / 打ち出し</button>
      <button id="alert">先バレ ON/OFF</button>
    </div>
    <div class="notice">通常 1/399.7　初当たり200玉　RUSH突入50%　RUSH187回転・1/99　継続率 約85%</div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
const symbols=["7","喰","影","月","血","眼","零"];
let busy=false,rush=false,alertOn=false,balls=0,streak=0,hits=0,rushes=0,rushLeft=0;
function ui(){
  $("balls").textContent=balls.toLocaleString();
  $("streak").textContent=streak;
  $("hits").textContent=hits;
  $("rushes").textContent=rushes;
  $("mode").textContent=rush?"RUSH中":"通常時";
  $("mode").className="badge "+(rush?"rush":"");
  $("counter").textContent=rush?`RUSH残り ${rushLeft}`:"RUSH残り ---";
  $("counter").className="badge "+(rush?"rush":"");
}
function cls(c){
  document.body.classList.remove("red","gold","shake");
  if(c)document.body.classList.add(c);
}
function effect(type){
  const stage=$("stage"), flash=$("flash");
  stage.classList.remove("critical","grip");
  void stage.offsetWidth;
  if(type==="hot"){stage.classList.add("critical");cls("red");}
  if(type==="gold"){stage.classList.add("critical");cls("gold");}
  if(type==="grip"){stage.classList.add("grip");cls("gold");}
  if(type!=="normal"){flash.classList.remove("on");void flash.offsetWidth;flash.classList.add("on");document.body.classList.add("shake");}
}
function setReels(){
  $("r1").textContent=symbols[Math.floor(Math.random()*symbols.length)];
  $("r2").textContent=symbols[Math.floor(Math.random()*symbols.length)];
  $("r3").textContent=symbols[Math.floor(Math.random()*symbols.length)];
}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
async function spin(){
  if(busy)return;
  busy=true;cls();setReels();$("message").textContent="変動中…";
  await wait(420);
  const hit=rush ? Math.random()<1/99 : Math.random()<1/399.7;
  if(!hit){
    if(rush){
      rushLeft--; $("message").textContent=`残り ${rushLeft}`;
      effect(rushLeft<=10?"hot":"normal");
      await wait(350);
      if(rushLeft<=0){rush=false;streak=0;$("message").textContent="RUSH終了";await wait(500)}
    }else{
      const hot=alertOn && Math.random()<.12;
      effect(hot?"hot":"normal");$("message").textContent=hot?"ざわ…":"ハズレ";
      await wait(280);
    }
    ui();busy=false;return;
  }
  hits++;
  effect(rush?"gold":"hot");
  $("message").textContent="激アツ";
  await wait(650);
  if(rush){
    const payout=Math.random()<.30?4000:1000;
    balls+=payout;streak++;rushLeft=187;
    $("winTitle").textContent=payout===4000?"超大当たり":"大当たり";
    $("winText").textContent=`RUSH継続！ ${payout.toLocaleString()}玉獲得。残り回数を187回にリセット。`;
    $("modal").classList.add("show");
  }else{
    balls+=200;
    const enter=Math.random()<.50;
    $("winTitle").textContent="初当たり";
    $("winText").textContent=enter?"200玉獲得。RUSH突入50%を突破…！":"200玉獲得。通常時へ。";
    $("modal").classList.add("show");
    if(enter){await wait(450);startRush()}
  }
  ui();busy=false;
}
async function startRush(){
  rush=true;rushes++;rushLeft=187;streak=Math.max(1,streak);
  $("modal").classList.remove("show");$("message").textContent="RUSH突入";
  effect("grip");await wait(900);ui();
}
$("start").addEventListener("pointerdown",spin);
$("alert").addEventListener("pointerdown",()=>{alertOn=!alertOn;$("alert").textContent=`先バレ ${alertOn?"ON":"OFF"}`});
$("close").addEventListener("pointerdown",()=>{$("modal").classList.remove("show");ui()});
ui();
</script>
</body>
</html>
