<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>喰界 -KUUKAI-</title>
<style>
:root{--red:#ff164f;--gold:#ffd15a;--bg:#07070b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;overflow:hidden}
body{display:flex;justify-content:center}
#game{position:relative;width:min(100vw,560px);height:100dvh;max-height:1000px;background:radial-gradient(circle at 50% 35%,#421022 0,#110a11 48%,#020205 100%);overflow:hidden}
header{height:72px;padding:9px 13px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #5b1530;background:#0d0d13}
.logo{font-size:24px;font-weight:1000;letter-spacing:5px;color:var(--red);text-shadow:0 0 15px var(--red)}
.logo small{display:block;font-size:8px;letter-spacing:4px;text-align:center;color:#aaa}
#stateBox{text-align:right;color:#aaa;font-size:10px}#state{font-size:18px;color:#fff;font-weight:900}
#stage{position:absolute;top:82px;left:9px;right:9px;bottom:163px;border:2px solid #3b3743;border-radius:20px;overflow:hidden;background:radial-gradient(circle at 50% 38%,#50142b 0,#160b14 45%,#030306 100%);box-shadow:inset 0 0 80px #000}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 4px,rgba(255,255,255,.02) 5px)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:20}
.flash{animation:flash .45s}.shake{animation:shake .38s}
@keyframes flash{0%{opacity:0}20%{opacity:.95}100%{opacity:0}}
@keyframes shake{0%,100%{transform:translate(0)}20%{transform:translate(-8px,2px)}40%{transform:translate(7px,-2px)}60%{transform:translate(-5px,1px)}80%{transform:translate(4px,-1px)}}
#message{position:absolute;top:23px;left:0;right:0;text-align:center;font-size:20px;font-weight:1000;text-shadow:0 0 18px #000;z-index:3}
#alert{position:absolute;top:62px;left:0;right:0;text-align:center;height:23px;color:var(--red);font-weight:1000;letter-spacing:4px;text-shadow:0 0 15px var(--red);z-index:3}
#reels{position:absolute;top:103px;left:15px;right:15px;display:flex;gap:7px}
.reel{height:118px;flex:1;border:4px solid #383840;border-radius:12px;background:linear-gradient(#fff,#aaa);color:#111;display:flex;align-items:center;justify-content:center;font-size:51px;font-weight:1000;box-shadow:0 6px 0 #000}
.reel.hot{color:#d40b40;background:linear-gradient(#fff,#f6a9b9);box-shadow:0 0 28px var(--red)}
#reserve{position:absolute;top:235px;left:0;right:0;text-align:center;color:#aaa;font-size:12px}
#mode{position:absolute;bottom:61px;left:0;right:0;text-align:center;font-size:31px;font-weight:1000;color:var(--red);text-shadow:0 0 20px var(--red)}
#desc{position:absolute;bottom:32px;left:0;right:0;text-align:center;color:#aaa;font-size:11px}
#hint{position:absolute;bottom:9px;left:0;right:0;text-align:center;color:#666;font-size:9px}
.controls{position:absolute;left:0;right:0;bottom:0;height:154px;padding:11px;background:#0e0e14;border-top:2px solid #292933}
.row{display:flex;gap:8px}.btn{height:57px;border:0;border-radius:13px;color:#fff;background:#292932;font-weight:1000;font-size:14px;box-shadow:inset 0 -4px #111;touch-action:manipulation}.btn:active{transform:translateY(2px);box-shadow:none}
#spin{flex:2;background:#8d1738;font-size:17px}#alertBtn{flex:1}.on{background:#9e183b!important;box-shadow:0 0 16px #8d1738}
.stats{display:flex;justify-content:space-between;margin-top:10px;color:#999;font-size:11px}.stats b{color:#fff}
#modal{display:none;position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.9);align-items:center;justify-content:center;padding:20px;text-align:center}
.card{width:92%;padding:24px;border:2px solid #851c3d;border-radius:18px;background:#130d14;box-shadow:0 0 50px #4d0b23}.card h1{margin:0 0 10px;color:var(--red);font-size:29px}.card p{color:#ddd;line-height:1.7;margin:0}.card button{width:100%;margin-top:15px}
#notice{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(.8);opacity:0;z-index:25;font-size:38px;font-weight:1000;white-space:nowrap;color:#fff;text-shadow:0 0 25px var(--red),0 0 45px var(--red);pointer-events:none}
.noticeOn{animation:notice .75s}.noticeGold{color:var(--gold)!important;text-shadow:0 0 25px #ff8c00,0 0 50px #ff8c00!important}
@keyframes notice{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.08)}}
</style>
</head>
<body>
<div id="game">
<header><div class="logo">喰界<small>KUUKAI / ORIGINAL</small></div><div id="stateBox">状態<br><b id="state">通常</b></div></header>
<main id="stage">
<div id="flash"></div><div id="message">STARTを押して回せ！</div><div id="alert"></div>
<div id="reels"><div class="reel" id="r1">7</div><div class="reel" id="r2">7</div><div class="reel" id="r3">7</div></div>
<div id="reserve">保留　0　｜　先バレ OFF</div>
<div id="mode">通常時</div><div id="desc">大当たり 1/399.7　｜　RUSH突入 25%</div><div id="hint">※これは完全オリジナルのゲームデモです</div>
<div id="notice">覚醒</div>
</main>
<div class="controls"><div class="row"><button class="btn" id="spin">START / 回す</button><button class="btn" id="alertBtn">先バレ OFF</button></div>
<div class="stats"><span>回転 <b id="cnt">0</b></span><span>出玉 <b id="balls">0</b>玉</span><span>連荘 <b id="streak">0</b></span><span>RUSH <b id="rushCnt">0</b>回</span></div></div>
<div id="modal"><div class="card"><h1 id="mt">喰界RUSH</h1><p id="mp"></p><button class="btn" id="close">続ける</button></div></div>
</div>
<script>
(()=> {
"use strict";
const $=id=>document.getElementById(id);
const symbols=["1","2","3","5","7","喰"];
let busy=false,rush=false,fast=false,alertOn=false,spins=0,balls=0,streak=0,rushCount=0;
const wait=ms=>new Promise(res=>setTimeout(res,ms));
function render(){
 $("cnt").textContent=spins;$("balls").textContent=balls;$("streak").textContent=streak;$("rushCnt").textContent=rushCount;
 $("state").textContent=rush?"喰界RUSH":"通常";
 $("reserve").textContent="保留　0　｜　先バレ "+(alertOn?"ON":"OFF");
}
function anim(sh=false,fl=false){
 $("stage").classList.remove("shake");$("flash").classList.remove("flash");
 void $("stage").offsetWidth;
 if(sh)$("stage").classList.add("shake");if(fl)$("flash").classList.add("flash");
}
function notice(text,gold=false){
 const n=$("notice");n.textContent=text;n.className=gold?"noticeOn noticeGold":"noticeOn";void n.offsetWidth;n.className=gold?"noticeOn noticeGold":"noticeOn";
}
function modal(title,text){$("mt").textContent=title;$("mp").textContent=text;$("modal").style.display="flex";}
$("close").onclick=()=>{$("modal").style.display="none";};
$("alertBtn").onclick=()=>{if(busy)return;alertOn=!alertOn;$("alertBtn").textContent=alertOn?"先バレ ON":"先バレ OFF";$("alertBtn").classList.toggle("on",alertOn);render();};
async function spin(){
 if(busy)return;
 busy=true;$("spin").disabled=true;spins++;render();
 $("message").textContent=rush?"喰界RUSH――喰らえ。":"変動開始……";$("alert").textContent="";
 const alertHit=!rush&&alertOn&&Math.random()<0.15;
 if(alertHit){$("alert").textContent="⚠ 先バレ発生 ⚠";notice("先バレ");anim(true,false);await wait(450);}
 const hit=rush?Math.random()<0.80:Math.random()<1/399.7;
 const near=!hit&&Math.random()<0.10;
 const speed=fast?48:92;
 for(let i=0;i<15;i++){
   $("r1").textContent=symbols[Math.floor(Math.random()*symbols.length)];
   $("r2").textContent=symbols[Math.floor(Math.random()*symbols.length)];
   $("r3").textContent=symbols[Math.floor(Math.random()*symbols.length)];
   await wait(speed);
 }
 if(hit){
   $("r1").textContent="7";$("r2").textContent="喰";$("r3").textContent="7";
   ["r1","r2","r3"].forEach(id=>$(id).classList.add("hot"));
   notice(rush?"極喰":"覚醒",rush);anim(true,true);$("message").textContent=rush?"極喰 BONUS!!!":"覚醒 BONUS!!!";balls+=1500;
   await wait(700);
   if(!rush){
     const enter=Math.random()<0.25;
     if(enter){rush=true;streak=1;rushCount++;$("mode").textContent="喰界RUSH";$("desc").textContent="継続期待 約80%　｜　ALL 1500玉";modal("🔥 喰界RUSH突入 🔥","覚醒成功！ ここから高速RUSH。大当たりはALL1500玉。");}
     else{streak=0;modal("BONUS終了","1500玉獲得！ 今回はRUSH非突入。");}
   }else{
     streak++;$("mode").textContent="喰界RUSH";$("desc").textContent="継続期待 約80%　｜　ALL 1500玉";
   }
 }else if(rush){
   const old=streak;rush=false;streak=0;$("mode").textContent="通常時";$("desc").textContent="大当たり 1/399.7　｜　RUSH突入 25%";$("message").textContent="RUSH終了……";modal("RUSH終了","連荘 "+old+"回 / 総出玉 "+balls+"玉");
 }else{
   ["r1","r2","r3"].forEach(id=>$(id).classList.remove("hot"));
   $("message").textContent=near?"赤眼点滅……！？":"静寂……";
   if(near)anim(true,false);
 }
 render();busy=false;$("spin").disabled=false;
}
$("spin").onclick=spin;
$("spin").ontouchend=e=>{e.preventDefault();spin();};
render();
})();
</script>
</body></html>
